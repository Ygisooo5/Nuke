<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial, sans-serif" font-size="16">
  <rect width="600" height="300" fill="#ffffff"/>
  <!-- ядро гелия: 2 протона 2 нейтрона -->
  <circle cx="200" cy="130" r="34" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <circle cx="250" cy="130" r="34" fill="#95a5a6" stroke="#566573" stroke-width="2"/>
  <circle cx="200" cy="180" r="34" fill="#95a5a6" stroke="#566573" stroke-width="2"/>
  <circle cx="250" cy="180" r="34" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <text x="192" y="136" fill="#fff" font-weight="bold">p</text>
  <text x="243" y="186" fill="#fff" font-weight="bold">p</text>
  <text x="243" y="136" fill="#fff" font-weight="bold">n</text>
  <text x="192" y="186" fill="#fff" font-weight="bold">n</text>
  <text x="160" y="260">Ядро атома гелия ⁴₂He</text>

  <!-- легенда -->
  <circle cx="380" cy="100" r="14" fill="#e74c3c"/>
  <text x="405" y="106">протон (заряд +e)</text>
  <circle cx="380" cy="145" r="14" fill="#95a5a6"/>
  <text x="405" y="151">нейтрон (заряда нет)</text>
  <text x="365" y="200">Z = 2 (протонов)</text>
  <text x="365" y="225">A = 4 (нуклонов)</text>
  <text x="365" y="250">N = A − Z = 2</text>
</svg>
