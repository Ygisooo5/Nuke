<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial, sans-serif" font-size="14">
  <rect width="600" height="300" fill="#ffffff"/>
  <!-- источник альфа частиц -->
  <rect x="20" y="120" width="70" height="60" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2"/>
  <text x="25" y="205">источник α</text>
  <!-- фольга -->
  <rect x="300" y="40" width="8" height="220" fill="#f1c40f" stroke="#b7950b"/>
  <text x="270" y="30">золотая фольга</text>
  <!-- экран -->
  <path d="M 470 30 A 160 160 0 0 1 470 270" fill="none" stroke="#1abc9c" stroke-width="6"/>
  <text x="530" y="45">экран</text>
  <!-- лучи прошедшие прямо -->
  <g stroke="#e74c3c" stroke-width="2" marker-end="url(#a)">
    <line x1="90" y1="140" x2="520" y2="140"/>
    <line x1="90" y1="150" x2="525" y2="150"/>
    <line x1="90" y1="160" x2="520" y2="160"/>
  </g>
  <!-- отклонился -->
  <polyline points="90,145 304,145 480,60" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#a)"/>
  <!-- отскочил назад -->
  <polyline points="90,155 300,155 130,250" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="140" y="280" fill="#c0392b">редкие частицы отскакивают назад</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>
